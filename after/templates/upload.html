{% extends "base.html" %}

{% block title %}上传头像 - 用户管理系统{% endblock %}

{% block content %}
    <div class="card login-card">
        <h2 class="card-title">上传头像</h2>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('upload') }}" class="form" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label for="avatar">选择头像文件</label>
                <input type="file" id="avatar" name="avatar" class="form-input" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">上传</button>
        </form>

        {% if file_url %}
        <div class="upload-result">
            <p class="text-muted">上传成功</p>
            <img src="{{ file_url }}" alt="头像预览" class="avatar-preview">
        </div>
        {% endif %}
    </div>
{% endblock %}
