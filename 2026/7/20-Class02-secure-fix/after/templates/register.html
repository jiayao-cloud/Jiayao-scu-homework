{% extends "base.html" %}
{% block title %}注册 - 用户管理系统{% endblock %}
{% block content %}
<div class="card login-card">
    <h2 class="card-title">用户注册</h2>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('register') }}" class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" class="form-input" placeholder="3-32 位字母、数字或下划线" required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="至少 8 位，包含字母和数字" required autocomplete="new-password">
        </div>
        <div class="form-group">
            <label for="email">邮箱</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="请输入邮箱" required autocomplete="email">
        </div>
        <div class="form-group">
            <label for="phone">手机号</label>
            <input type="text" id="phone" name="phone" class="form-input" placeholder="请输入 11 位手机号" required autocomplete="tel">
        </div>
        <button type="submit" class="btn btn-primary btn-block">注 册</button>
    </form>

    <div class="action-bar">
        <p class="text-muted">已有账号？<a href="{{ url_for('login') }}" style="color:#667eea;">立即登录</a></p>
    </div>
</div>
{% endblock %}
